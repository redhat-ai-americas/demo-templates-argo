apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-application
spec:
  destination:
    name: in-cluster
    namespace: redhat-ods-applications
  source:
    path: helm/20-mlflow/
    repoURL: https://github.com/redhat-ai-americas/demo-templates-argo.git
    targetRevision: HEAD
    helm:
      valuesObject:
        minio:
          enabled: true
          buckets:
            models: models
            pipelineArtifacts: pipeline-artifacts
            rootUser: 'minio'
            rootPassword: 'minio!23'
        database:
          user: 'mlflowuser'
          password: 'mlflowpassword'
          database: 'mlflow'
  sources: []
  project: default
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 3
        maxDuration: 30m
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops