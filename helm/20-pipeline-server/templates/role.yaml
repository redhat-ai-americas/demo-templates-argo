kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pipeline-server-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
rules:
  - verbs:
      - create
      - delete
      - get
    apiGroups:
      - ''
    resources:
      - secrets
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pipeline-server2-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "21"
rules:
  - verbs:
      - get
    apiGroups:
      - route.openshift.io
    resources:
      - routes