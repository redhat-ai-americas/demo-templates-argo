  kind: ClusterRole
  name: mlflow-operator-mlflow-integration
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dspa-mlflow-integration
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: build-model
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-integration