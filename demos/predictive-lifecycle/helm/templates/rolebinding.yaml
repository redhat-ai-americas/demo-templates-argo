kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pipeline-server-registry-access-{{ .Release.Namespace }}
  namespace: rhoai-model-registries
  annotations:
    argocd.argoproj.io/sync-wave: "110"
subjects:
  - kind: ServiceAccount
    name: pipeline-server-{{ .Release.Namespace }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-user-{{ .Release.Name }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pipeline-server-inference-access-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "110"
subjects:
  - kind: ServiceAccount
    name: pipeline-server-{{ .Release.Namespace }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-ability
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dspa-mlflow-integration
  namespace: {{ .Release.Namespace }}
